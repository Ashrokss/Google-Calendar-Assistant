services:
  backend:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app/src
    volumes:
      - ./src:/app/src
      - ./src/credentials:/app/src/credentials
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    working_dir: /app/src

  frontend:
    build: .
    env_file: .env
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
      - PYTHONPATH=/app/src
    volumes:
      - ./src:/app/src
      - ./src/credentials:/app/src/credentials
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    working_dir: /app/src
    depends_on:
      - backend
